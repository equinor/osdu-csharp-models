version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    cooldown:
      default-days: 7
    # Prefix commit messages with "deps" to include dependency updates in patch releases
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: sunday
    cooldown:
      default-days: 7
    # Prefix commit messages with "deps" to include dependency updates in patch releases
    commit-message:
      prefix: deps
    # Group into one PR. NuGet titles are still sentence-case ("Bump the nuget
    # group..."); .commitlintrc.yml allows that for the subject-case rule.
    groups:
      nuget:
        patterns: ["*"]
